<script async type="text/javascript" src="https://static.klaviyo.com/onsite/js/klaviyo.js?company_id={{ site.klaviyo_id }}"></script>
<script>
  window.addEventListener("klaviyoLoaded", function () {
    var klaviyo = window.klaviyo || [];
    klaviyo.init({
      account: "{{ site.klaviyo_id }}",
      platform: "custom"
    });
    klaviyo.enable("signup_forms");
  });
</script>
